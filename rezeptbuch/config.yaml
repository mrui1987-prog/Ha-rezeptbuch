name: HA-Rezeptbuch
version: "0.10.30"
slug: rezeptbuch
description: Rezeptverwaltung, Produktionsliste und Wiegeablauf für kleine Bäckereien
url: https://github.com/mrui1987-prog/ha-rezeptbuch
arch:
  - aarch64
  - amd64
init: false
# Oberfläche nur über HA-Ingress (mit HA-Anmeldung), kein offener Port
ingress: true
ingress_port: 8099
panel_icon: mdi:scale
panel_title: Rezeptbuch
# Wetter für die Stationsoberfläche (Modul 10, M10-16): Lesen aus Home Assistant über die Supervisor-API
homeassistant_api: true
services:
  - mqtt:need
options:
  admin_timeout_minutes: 5
  log_level: info
  weather_entity: weather.forecast_home
schema:
  admin_timeout_minutes: int(1,60)
  log_level: list(debug|info|warning|error)
  weather_entity: str?
  reader_url: str?
