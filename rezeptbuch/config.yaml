name: HA-Rezeptbuch
version: "0.5.8"
slug: rezeptbuch
description: Rezeptverwaltung, Produktionsliste und Wiegeablauf für kleine Bäckereien
url: https://github.com/mrui1987-prog/ha-rezeptbuch
arch:
  - aarch64
  - amd64
init: false
# Oberfläche nur über HA-Ingress (mit HA-Anmeldung), kein offener Port
ingress: true
ingress_port: 8099
panel_icon: mdi:scale
panel_title: Rezeptbuch
services:
  - mqtt:need
options:
  admin_timeout_minutes: 5
  log_level: info
schema:
  admin_timeout_minutes: int(1,60)
  log_level: list(debug|info|warning|error)
