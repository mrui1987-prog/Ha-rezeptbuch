name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        addon: [rezeptbuch, rezeptbuch_waage]
    defaults:
      run:
        working-directory: ${{ matrix.addon }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest httpx -r requirements.txt
      - run: python -m pytest -q

  tools-kennzeichnungspass:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest pdfplumber
      - run: python -m pytest -q tools/kennzeichnungspass
